<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contoh Position CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="static-box">Static Position</div>
        <div class="relative-box">Relative Position (Geser 20px ke kanan, 10px ke bawah)</div>
        <div class="absolute-box">Absolute Position (Di dalam .container)</div>
        <div class="sticky-box">Sticky Position (Tetap di atas saat discroll)</div>
        <div class="spacer">Scroll ke bawah untuk melihat efek posisi fixed</div>
        <div class="fixed-box">Fixed Position (Tetap di pojok bawah kanan)</div>
    </div>
</body>
</html>
